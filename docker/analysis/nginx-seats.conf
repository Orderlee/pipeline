# FiftyOne 좌석 라우터 — 포트 하나(:5153)로 접속하고, 사람마다 다른 백엔드 프로세스에 붙는다.
#
# 왜 필요한가: FiftyOne OSS 는 서버 상태가 프로세스 전역 싱글턴이라(`server/events/state.py`
# 의 `_state`), `set_dataset` 같은 mutation 이 발신자를 뺀 전 접속자에게 팬아웃된다
# (`server/mutation.py:118`). 한 프로세스를 여럿이 보면 A 의 데이터셋 전환이 B 화면을 끌어간다.
# OSS 에 user/session 개념이 없어 격리 단위가 프로세스뿐이므로, 좌석 = 프로세스 = 백엔드다.
#
# 좌석 배정 우선순위 (2026-09-03): ?seat=N(명시 전환) > 쿠키 > 알려진 IP 표 > 좌석 선택 랜딩.
#   `http://<host>:5153/?seat=2` 로 한 번 들어오면 1년짜리 쿠키가 박히고 이후 맨 URL 로 같은
#   좌석에 붙는다. 셋 다 없으면 프록시하지 않고 좌석 선택 페이지를 돌려준다 — "아무것도 안 하면
#   좌석 1 공용" 이던 예전 기본값은 전원이 한 프로세스를 공유하는 사고로 실측돼 폐기했다.
# ⚠️ 이 파일은 **단일 파일 bind mount** 다. 에디터/Edit 도구가 파일을 새 inode 로 교체하면 컨테이너는
#   옛 inode 를 계속 본다 — `nginx -s reload` 가 성공해도 변경이 반영되지 않는다(2026-09-03 실측: 세 번의
#   reload 가 전부 무효였다). 반영 = `docker restart docker-analysis-fiftyone-proxy-1`(마운트 재해석,
#   SSE 잠깐 끊김) 또는 inode 를 보존하는 in-place 쓰기(`cat new > nginx-seats.conf`) 후 reload.
#   확인법: 호스트 `stat -c %i` 와 컨테이너 `stat -c %i /etc/nginx/conf.d/default.conf` 가 같은지.
# ponytail: 서버가 좌석을 자동 배정하려면 상태(누가 어디 앉았나)가 필요한데 nginx 는 무상태다.
#   해시 자동배정은 5인 기준 충돌 96% 라 탈락. 고정 IP 표 + 강제 선택이 무상태로 되는 최선이고,
#   점유 표시가 필요해지면 그때 좌석 대장(작은 서비스)을 만든다.

# 알려진 사람별 고정 IP → 좌석 (관리자 지정석). **IP 표가 쿠키보다 우선**한다 — 무거운 프롬프트 분석을
# 하는 사람이 자동 배정으로 3g 상한 좌석에 앉아 OOM 으로 죽는 사고가 실제로 났다(2026-09-03, 좌석 2
# oom_kill). 표에 있는 사람은 쿠키 상태와 무관하게 항상 지정 좌석으로 간다. `?seat=N` 은 그래도 최우선
# (그 방문만 — 다음 맨 URL 접속은 다시 표대로).
map $remote_addr $ip_seat {
    default   "";
    # 프록시 컨테이너 자신의 healthcheck(compose: wget localhost:5151/)는 쿠키가 없다 — 이걸 배정기로
    # 보내면 매분 빈 좌석 하나를 20초 홀드로 태워 실제 사용자가 "빈 좌석 없음"을 받는다. 좌석 1 로 고정.
    127.0.0.1      "1";
    "::1"          "1";
    # 2026-09-03 관측: sourcei 프롬프트 분석 사용 브라우저(Mac Chrome) — 좌석 2 OOM 유발 → 무제한 좌석 1 고정.
    # 누구 IP 인지는 사용자 확인 후 필요하면 정정.
    10.0.10.118  "1";
}

map $cookie_foseat $seat_from_cookie {
    default   "";
    ~^[1-5]$  $cookie_foseat;      # 평소: 쿠키에 박힌 좌석
}

map $ip_seat $seat_from_ip_or_cookie {
    default   $ip_seat;            # IP 표에 있으면 그 좌석 (쿠키 무시)
    ""        $seat_from_cookie;   # 표에 없으면 쿠키
}

map $arg_seat $seat_key {
    default   $seat_from_ip_or_cookie;
    ~^[1-5]$  $arg_seat;           # ?seat=N 이 오면 그걸로 갈아탄다
}

map $arg_seat $seat_cookie {
    default   "";                                                 # 빈 값이면 nginx 가 헤더를 안 붙인다
    ~^[1-5]$  "foseat=$arg_seat; Path=/; Max-Age=31536000; SameSite=Lax";
}

map $seat_key $seat_upstream {
    default   analysis-fiftyone:5151;      # 좌석 1 = 무거운 프롬프트 분석용(메모리 상한 없음)
    "2"       analysis-fiftyone-2:5151;
    "3"       analysis-fiftyone-3:5151;
    "4"       analysis-fiftyone-4:5151;
    "5"       analysis-fiftyone-5:5151;
}

# 화면 이동(navigation) 과 API 요청을 Accept 로 구분한다. 브라우저의 페이지 로드는 `text/html` 을 보내고,
# fetch(GraphQL·/operators)는 `*/*`·`application/json`, EventSource(/events)는 `text/event-stream` 이다.
# 좌석 미정/사망 시 **navigation 만** 배정기(302→HTML)로 보내고 API 는 JSON 오류를 돌려줘야 한다 —
# API 를 302 로 보내면 fetch 가 리다이렉트를 따라가 HTML 을 받고 앱이
# `SyntaxError: Unexpected token '<', "<!doctype"... is not valid JSON` 으로 죽는다(2026-09-03 실측).
map $http_accept $is_nav {
    default     0;
    ~*text/html 1;
}
map $seat_key $seat_ok {
    default   0;
    ~^[1-5]$  1;
}

# 웹소켓 업그레이드 통과용 (FiftyOne 은 주로 SSE 를 쓰지만 플러그인/미디어 경로가 WS 를 탄다)
map $http_upgrade $connection_upgrade {
    default   upgrade;
    ""        "";
}

server {
    listen 5151;
    listen [::]:5151;   # compose healthcheck 의 busybox wget 이 localhost 를 [::1] 로 푼다 — v4 만 열면 영구 unhealthy
    server_name _;
    # 라우팅 본문(server 공통 지시자 + 모든 location)은 HTTPS 블록과 공유한다 — seat-tls/routing.inc.
    include /etc/nginx/seat-tls/routing.inc;
}

# HTTPS 는 기본 꺼짐. gen-seat-cert.sh 를 돌리면 seat-tls/tls.conf 가 생겨 여기서 잡힌다.
# 와일드카드 include 는 매칭이 없어도 에러가 아니다 — 켜기 전에는 이 줄이 무동작이다.
# TLS 블록도 위와 **같은 라우팅**을 써야 한다. 복제하지 말고 한 줄만 넣으면 된다:
#   server { listen 5443 ssl; ssl_certificate ...; ssl_certificate_key ...;
#            include /etc/nginx/seat-tls/routing.inc; }
#   그대로 쓸 수 있는 본은 `seat-tls/tls.conf.example`. 이 include 가 빠진 TLS 블록(예전 초안
#   gen-seat-cert.sh 가 만들던 proxy_pass 전용 블록)을 그대로 켜면 쿠키 없는 HTTPS 접속자가 전원
#   좌석 1(default)로 몰린다 — 조용히 퇴행하므로 켜기 전 `curl -k -I https://... `로 X-Seat 를 확인할 것.
include /etc/nginx/seat-tls/*.conf;
